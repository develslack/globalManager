<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Manager - Acceso</title>

    <!-- Hojas de estilo troncales del Framework -->
    <link rel="stylesheet" href="views/CoreUI/css/core.css">
    <link rel="stylesheet" href="views/CoreUI/css/icons-basic.css">
    <link rel="stylesheet" href="views/CoreUI/css/forms.css">
    <link rel="stylesheet" href="views/CoreUI/css/toasts.css">
    <link rel="stylesheet" href="views/CoreUI/css/navbar-index.css">
</head>
<body class="auth-body">

    <!-- Contenedor estanco para la inyección dinámica del Navbar GNOME -->
    <div id="auth-header-container"></div>

    <!-- Viewport dinámico para Login / Registro / Password -->
    <div class="auth-wrapper">
        <main id="app-view"></main>
    </div>

    <!-- 1. Scripts Troncales del Framework CoreUI -->
    <script src="views/CoreUI/js/libcore.js"></script>
    <script src="views/CoreUI/js/handler.js"></script>
    <script src="views/CoreUI/js/session_secure.js"></script>

    <!-- 2. Paquete de Idiomas e i18n de Global Manager -->
    <script src="views/global_manager/i18n/lang_es.js"></script>
    <script src="views/global_manager/i18n/gm_i18n.js"></script>

    <!-- 3. Scripts de Lógica Específica del Proyecto Global Manager -->
    <script src="views/global_manager/logic/gm_login.js"></script>
    <script src="views/global_manager/logic/gm_register.js"></script>
    <script src="views/global_manager/logic/gm_password.js"></script>

    <!-- 4. Cargador Troncal de la Aplicación -->
    <script src="views/logic/app/logic.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // 🔒 Escrutinio permanente y trampa Sandbox en la ruta de acceso /
        if (typeof SessionSecure !== 'undefined' && typeof SessionSecure.protectLogin === 'function') {
            SessionSecure.protectLogin();
        }

        // 📥 Carga dinámica del componente parcial navbar-index.html
        fetch('views/logic/components/navbar-index.html')
            .then(response => {
                if (!response.ok) throw new Error("HTTP error " + response.status);
                return response.text();
            })
            .then(html => {
                const headerContainer = document.getElementById('auth-header-container');
                if (headerContainer) {
                    headerContainer.innerHTML = html;

                    // Traducir el DOM inyectado del navbar si el paquete de idioma está activo
                    if (typeof GMi18n !== 'undefined' && typeof GMi18n.translateDOM === 'function') {
                        GMi18n.translateDOM();
                    }
                }
            })
            .catch(err => console.error("[Index] Error al cargar el navbar parcial:", err));

        // Inicializar el enrutador de vistas sobre #app-view
        CoreUI.init({
            viewContainerId: 'app-view',
            viewsFolder: 'views/logic/components/',
            defaultView: 'login',
            baseRoute: '/'
        }, AppLogic);
    });
    </script>
</body>
</html>
