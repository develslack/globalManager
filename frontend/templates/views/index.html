<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Manager - Acceso</title>

    <!-- Hojas de estilo troncales -->
    <link rel="stylesheet" href="views/CoreUI/css/core.css">
    <link rel="stylesheet" href="views/CoreUI/css/icons-basic.css">
    <link rel="stylesheet" href="views/CoreUI/css/forms.css">
    <link rel="stylesheet" href="views/CoreUI/css/toasts.css">
    <link rel="stylesheet" href="views/CoreUI/css/navbar-index.css">
</head>
<body class="auth-body">

    <!-- Navbar superior GNOME -->
    <div id="auth-header-container"></div>

    <!-- Viewport dinámico para Login / Registro / Password -->
    <div class="auth-wrapper">
        <main id="app-view"></main>
    </div>

    <!-- 1. Scripts Troncales del Framework CoreUI -->
    <script src="views/CoreUI/js/libcore.js"></script>
    <script src="views/CoreUI/js/handler.js"></script>

    <!-- 2. Paquete de Idiomas e i18n -->
    <script src="views/global_manager/i18n/lang_es.js"></script>
    <script src="views/global_manager/i18n/gm_i18n.js"></script>

    <!-- 3. Scripts de Lógica Específica del Proyecto Global Manager -->
    <script src="views/global_manager/logic/gm_login.js"></script>
    <script src="views/global_manager/logic/gm_register.js"></script>
    <script src="views/global_manager/logic/gm_password.js"></script>

    <!-- 4. Cargador Troncal de App -->
    <script src="views/logic/app/logic.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Cargar la barra superior
            fetch('views/logic/components/navbar-index.html')
                .then(res => res.text())
                .then(html => {
                    document.getElementById('auth-header-container').innerHTML = html;
                })
                .catch(err => console.error('[Index] Error al cargar navbar:', err));

            // Inicializar el enrutador de entrada CoreUI
            CoreUI.init({
                viewContainerId: 'app-view',
                viewsFolder: 'views/logic/components/',
                defaultView: 'login'
            }, AppLogic);
        });
    </script>
</body>
</html>
