<div id="modal-new_user" class="modal-backdrop">
    <div class="modal modal-md modal-success">
        <div class="modal-header">
            <h4 class="modal-title">
                <span class="icon icon-actions-resource-group-new icon-lg"></span> Alta de Usuario
            </h4>
            <button type="button" class="btn-modal-close" data-core-dismiss="modal">&times;</button>
        </div>

        <!-- El ID del formulario debe coincidir con el que busca JS -->
        <form id="form-new_user">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Nombre y Apellido</label>
                    <input type="text" name="name" id ="name" class="form-control" required placeholder="Ingrese su Nombre y Apellido">
                </div>
                <div class="form-group">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" name="email" id ="email" class="form-control" required placeholder="usuario@empresa.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-embedded">
                        <input type="password" name="password_1" id ="password_1" class="form-control" required placeholder="Ingrese un password">
                        <button type="button"
                            class="btn btn-default btn-sm" onclick="LibCore.togglePassword('password_1', this)"
                            data-core-toggle="password"
                            data-target="input-pass"
                            title="Mostrar/Ocultar contraseña">
                            <span class="icon icon-actions-layer-visible-on icon-sm"></span>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Repetir Password</label>
                        <div class="input-embedded">
                        <input type="password" name="password_2" id ="password_2" class="form-control" required placeholder="Repita el password">
                            <button type="button"
                                class="btn btn-default btn-sm" onclick="LibCore.togglePassword('password_2', this)"
                                data-core-toggle="password"
                                data-target="input-pass"
                                title="Mostrar/Ocultar contraseña">
                                <span class="icon icon-actions-layer-visible-on icon-sm"></span>
                            </button>
                        </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Asignar Rol</label>
                    <!-- Este select lo llenaremos dinámicamente con JS -->
                    <select name="rol" id="select-new-user-rol" class="form-control" required>
                        <option value="" disabled selected>Cargando roles...</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default btn-sm" data-core-dismiss="modal">
                    <span class="icon icon-actions-application-exit icon-sm"></span> Cancelar</button>
                <button type="submit" class="btn btn-default btn-sm">
                    <span class="icon icon-actions-dialog-ok icon-sm"></span> Aceptar</button>
            </div>
        </form>
    </div>
</div>
