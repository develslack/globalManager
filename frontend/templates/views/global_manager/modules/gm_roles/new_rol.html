<div id="modal-new_rol" class="modal-backdrop">
    <div class="modal modal-sm modal-success">
        <div class="modal-header">
            <h4 class="modal-title">
                <span class="icon icon-actions-list-add icon-lg"></span> Alta de Rol
            </h4>
            <button type="button" class="btn-modal-close" data-core-dismiss="modal">&times;</button>
        </div>

        <!-- El ID del formulario debe coincidir con el que busca JS -->
        <form id="form-new_rol">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Descripcion</label>
                    <input type="text" name="descripcion" id ="descripcion" class="form-control" required placeholder="Ingrese una descripción para el nuevo rol">
                </div>
                <div class="modal-footer">
                <button type="button" class="btn btn-default btn-sm" data-core-dismiss="modal">
                    <span class="icon icon-actions-application-exit icon-sm"></span> Cancelar</button>
                <button type="submit" class="btn btn-default btn-sm">
                    <span class="icon icon-actions-dialog-ok icon-sm"></span> Aceptar</button>
            </div>
        </form>
    </div>
</div>
