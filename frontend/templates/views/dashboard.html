<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Manager - Dashboard</title>
    <link rel="stylesheet" href="views/CoreUI/css/core.css">
    <link rel="stylesheet" href="views/CoreUI/css/icons-basic.css">
    <link rel="stylesheet" href="views/CoreUI/css/navbar-dashboard.css">
    <link rel="stylesheet" href="views/CoreUI/css/buttons.css">
    <link rel="stylesheet" href="views/CoreUI/css/modals.css">
    <link rel="stylesheet" href="views/CoreUI/css/toasts.css">
    <link rel="stylesheet" href="views/CoreUI/css/panels.css">
    <link rel="stylesheet" href="views/CoreUI/css/jumbotron.css">
    <link rel="stylesheet" href="views/CoreUI/css/alerts.css">
    <link rel="stylesheet" href="views/CoreUI/css/badges.css">
    <link rel="stylesheet" href="views/CoreUI/css/progress.css">
    <link rel="stylesheet" href="views/CoreUI/css/list-groups.css">
    <link rel="stylesheet" href="views/CoreUI/css/collapse.css">
    <link rel="stylesheet" href="views/CoreUI/css/tabs.css">
    <link rel="stylesheet" href="views/CoreUI/css/inputs.css">
    <link rel="stylesheet" href="views/CoreUI/css/tooltips.css">
    <link rel="stylesheet" href="views/CoreUI/css/popovers.css">
    <link rel="stylesheet" href="views/CoreUI/css/tables.css">
    <link rel="stylesheet" href="views/CoreUI/css/loaders.css">
    <link rel="stylesheet" href="views/CoreUI/css/animations.css">
    <link rel="stylesheet" href="views/CoreUI/css/animations-advanced.css">
    <link rel="stylesheet" href="views/CoreUI/css/themes.css">
    <link rel="stylesheet" href="views/CoreUI/css/home.css">
    <link rel="stylesheet" href="views/CoreUI/css/gm_not_available.css">
</head>
<body class="dashboard-body">

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="#" data-route="gm_home" class="nav-item">
                    <span class="icon icon-accesories-utilities-desktop-extra icon-sm"></span> Global Manager</a>
            </div>
            <nav class="sidebar-nav">
                <a href="#" data-route="gm_analitics" class="nav-item" data-i18n="menu_users">
                    <span class="icon icon-actions-view-calendar-time-spent icon-lg"></span> Alertas / Analiticas</a>
                <a href="#" data-route="gm_main_manager" class="nav-item" data-i18n="menu_stock">
                    <span class="icon icon-actions-resource-group icon-lg"></span> Administración</a>
                <a href="#" data-route="gm_supplies" class="nav-item" data-i18n="menu_stock">
                    <span class="icon icon-actions-code-block icon-lg"></span> Inventario / Productos</a>
                <a href="#" data-route="gm_cash_flow" class="nav-item" data-i18n="menu_stock">
                    <span class="icon icon-actions-view-financial-transfer icon-lg"></span> Finanzas / Caja</a>
            </nav>
        </aside>

        <!-- Main Content Viewport -->
        <div class="main-wrapper">
            <header class="topbar">
                <span class="view-title">
                    <button class="btn btn-default" data-route="gm_control_panel">
                        <span class="icon icon-categories-preferences-system icon-sm"></span>Panel de Control</button>
                    <button class="btn btn-default">
                        <span class="icon icon-apps-help-browser icon-sm"></span>Ayuda al Usuario</button>
                </span>
                <button id="btn-logout" class="btn btn-default" data-i18n="ui_logout">
                     <span class="icon icon-actions-system-shutdown icon-sm"></span>Cerrar Sesión</button>
            </header>

            <!-- Dynamic Viewport -->
            <main id="dashboard-view" class="content-viewport">
            </main>
        </div>
    </div>

    <!-- 1. Troncales del Framework CoreUI -->
    <script src="views/CoreUI/js/libcore.js"></script>
    <script src="views/CoreUI/js/tables.js"></script>

    <!-- 2. Paquete de Idiomas e i18n de Global Manager -->
    <script src="views/global_manager/i18n/lang_es.js"></script>
    <script src="views/global_manager/i18n/gm_i18n.js"></script>

    <!-- 3. Dynamic Router Handler del Proyecto -->
    <script src="views/CoreUI/js/session_secure.js"></script>
    <script src="views/global_manager/logic/gm_handler.js"></script>

   <!-- 4. Inicialización del Sandbox -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
            SessionSecure.protectDashboard();

            // Persistencia tras F5: Recuperar vista guardada o iniciar en 'gm_home'
            const initialView = sessionStorage.getItem('gm_current_view') || 'gm_home';

            GMHandler.init({
                viewContainerId: 'dashboard-view',
                modulesFolder: 'views/global_manager/modules/',
                defaultView: initialView,
                baseRoute: '/dashboard'
            });
        });
</script>
</body>
</html>
