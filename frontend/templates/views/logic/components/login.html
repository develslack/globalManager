<div class="auth-container">
    <div class="auth-header">
        <h1 data-i18n="auth_login_title">Iniciar Sesión</h1>
        <p data-i18n="auth_login_subtitle">Ingrese sus credenciales para acceder</p>
    </div>

    <div id="login-alert" class="alert alert-danger" style="display: none;"></div>

    <form id="form-login">
        <div class="form-group">
            <label class="form-label" for="input-email" data-i18n="auth_email_label">Correo Electrónico</label>
            <input type="email" id="input-email" class="form-control" required placeholder="usuario@dominio.com">
        </div>

        <div class="form-group">
            <label class="form-label" for="input-password" data-i18n="auth_password_label">Contraseña</label>
            <div class="input-embedded">
                <input type="password" id="input-password" class="form-control" required placeholder="••••••••">
                <button type="button" class="btn-input-action" onclick="LibCore.togglePassword('input-password', this)">
                    <span class="icon icon-actions-layer-visible-on icon-sm"></span>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" data-i18n="auth_submit_btn">Ingresar</button>
    </form>
</div>
