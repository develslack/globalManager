<div class="auth-container">
    <div class="auth-header">
        <h1 data-i18n="auth_register_title">Registro de Usuario</h1>
        <p data-i18n="auth_register_subtitle">Complete los campos para registrarse</p>
    </div>

    <div id="register-alert" class="alert alert-danger" style="display: none;"></div>

    <form id="form-register">
        <div class="form-group">
            <label class="form-label" for="input-register-name" data-i18n="auth_name_label">Nombre Completo</label>
            <input type="text" id="input-register-name" class="form-control" required placeholder="Nombre Apellido">
        </div>

        <div class="form-group">
            <label class="form-label" for="input-register-email" data-i18n="auth_email_label">Correo Electrónico</label>
            <input type="email" id="input-register-email" class="form-control" required placeholder="usuario@dominio.com">
        </div>

        <div class="form-group">
            <label class="form-label" for="input-register-pass1" data-i18n="auth_password_label">Contraseña</label>
            <div class="input-embedded">
                <input type="password" id="input-register-pass1" class="form-control" required placeholder="••••••••">
                <button type="button" class="btn-input-action" onclick="LibCore.togglePassword('input-register-pass1', this)">
                    <span class="icon icon-actions-layer-visible-on icon-sm"></span>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="input-register-pass2" data-i18n="auth_confirm_password_label">Confirmar Contraseña</label>
            <div class="input-embedded">
                <input type="password" id="input-register-pass2" class="form-control" required placeholder="••••••••">
                <button type="button" class="btn-input-action" onclick="LibCore.togglePassword('input-register-pass2', this)">
                    <span class="icon icon-actions-layer-visible-on icon-sm"></span>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" data-i18n="auth_register_btn">Registrarse</button>
    </form>
</div>
